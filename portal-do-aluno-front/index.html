<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal do Aluno</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<section class="login" id="login">
  <div class="login-art">
    <h1>Seus estudos, num só lugar.</h1>
    <p>Consulte notas e disciplinas, leia os avisos da instituição e peça seus documentos sem ir à secretaria.</p>
  </div>
  <div class="login-form">
    <form id="lf" novalidate>
      <h2>Entrar no portal</h2>
      <div id="lerr" class="err hidden" role="alert"></div>
      <label>E-mail<input type="email" id="em" autocomplete="username" required></label>
      <label>Senha<input type="password" id="pw" autocomplete="current-password" required></label>
      <button class="btn" type="submit">Entrar</button>
      <p class="hint">Demonstração: aluno@portal.com ou secretaria@portal.com, senha 123456.</p>
    </form>
  </div>
</section>

<div class="app hidden" id="app">
  <aside class="side">
    <div class="brand">Portal do Aluno</div>
    <nav id="nav" style="display:contents"></nav>
    <div class="sp"></div>
    <button class="nav" id="out">Sair</button>
  </aside>
  <main class="main">
    <div class="top">
      <h1 id="title"></h1>
      <div class="who"><div class="av" id="ini"></div><div><div id="uname" style="font-weight:600"></div><div class="mut" id="urole"></div></div></div>
    </div>
    <div id="view" class="view"></div>
  </main>
</div>
<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

<script src="js/app.js"></script>
</body>
</html>
